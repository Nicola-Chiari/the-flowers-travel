# Decap CMS — The Flowers Travel
# Ogni campo qui deve esistere anche in src/content.config.ts (stessi nomi).
backend:
  name: github
  repo: Nicola-Chiari/the-flowers-travel
  branch: main
  base_url: https://api.netlify.com
  # site_domain non serve: Decap usa il dominio da cui apri /admin.
  commit_messages:
    create: "Nuovo {{collection}}: {{slug}}"
    update: "Modifica {{collection}}: {{slug}}"
    delete: "Elimina {{collection}}: {{slug}}"
    uploadMedia: "Carica {{path}}"
    deleteMedia: "Elimina {{path}}"

# Con `npx decap-server` in locale il CMS scrive direttamente sui file (solo su localhost).
local_backend: true

locale: it
# Le immagini stanno in src/ così il sito può ridimensionarle e convertirle in WebP.
media_folder: src/assets/uploads
public_folder: /src/assets/uploads
logo_url: /admin/logo.png
publish_mode: simple # "editorial_workflow" per bozze → revisione → pubblica
slug:
  encoding: ascii
  clean_accents: true

collections:
  # ---------- IMPOSTAZIONI ----------
  - name: settings
    label: "⚙ Impostazioni sito"
    files:
      - name: site
        label: "Contatti, social e SEO"
        file: src/content/settings/site.json
        fields:
          - { name: phone, label: "Telefono (visualizzato)", widget: string }
          - { name: phoneLink, label: "Telefono (solo cifre con prefisso, es. +393389358824)", widget: string, pattern: ['^\+?[0-9]{6,15}$', "Solo cifre, con prefisso (es. +393389358824)"] }
          - { name: email, label: "Email", widget: string }
          - { name: whatsappNumber, label: "Numero WhatsApp (solo cifre, es. 393389358824)", widget: string, pattern: ['^[0-9]{8,15}$', "Solo cifre, con prefisso internazionale, senza +"] }
          - { name: whatsappMessage, label: "Messaggio WhatsApp precompilato", widget: string }
          - { name: taxLabel, label: "Dato fiscale: etichetta (es. C.F. o P.IVA)", widget: string, required: false }
          - { name: taxId, label: "Dato fiscale: numero", widget: string, required: false, hint: "Compare nel footer. Vuoto = nascosto (ma per legge va indicato)." }
          - { name: logoNav, label: "Logo della barra di navigazione", widget: image }
          - { name: logoFooter, label: "Logo chiaro (footer)", widget: image }
          - { name: tagline, label: "Motto (footer e nastro sotto i viaggi)", widget: string }
          - name: socials
            label: "Social (lascia vuoto per nascondere)"
            widget: object
            fields:
              - { name: instagram, label: Instagram, widget: string, required: false }
              - { name: tiktok, label: TikTok, widget: string, required: false }
              - { name: facebook, label: Facebook, widget: string, required: false }
              - { name: pinterest, label: Pinterest, widget: string, required: false }
          - name: seo
            label: SEO
            widget: object
            fields:
              - { name: title, label: "Titolo pagina (Google)", widget: string }
              - { name: description, label: "Descrizione (Google, max 160 caratteri)", widget: text }
              - { name: image, label: "Immagine condivisione social (1200×630)", widget: image, required: false }

      - name: ui
        label: "Testi del sito (menu, modulo, footer)"
        file: src/content/settings/ui.json
        fields:
          - name: nav
            label: "Menu in alto"
            label_singular: "Voce"
            widget: list
            summary: "{{fields.label}}"
            hint: "Link: #sezione per la home (es. #viaggi), oppure l'indirizzo di una pagina (es. /viaggi/aicha-e-nicola-australia)."
            fields:
              - { name: label, label: Testo, widget: string }
              - { name: link, label: Link, widget: string }
              - name: children
                label: "Sottovoci (tendina)"
                label_singular: "Sottovoce"
                widget: list
                required: false
                summary: "{{fields.label}}"
                fields:
                  - { name: label, label: Testo, widget: string }
                  - { name: link, label: Link, widget: string }
          - { name: navMenuOpen, label: "Pulsante menu mobile (per lettori di schermo): apri", widget: string }
          - { name: navMenuClose, label: "Pulsante menu mobile: chiudi", widget: string }
          - { name: heroScroll, label: "Linea in fondo all'apertura (per lettori di schermo)", widget: string }
          - { name: carouselPrev, label: "Freccia indietro (per lettori di schermo)", widget: string }
          - { name: carouselNext, label: "Freccia avanti (per lettori di schermo)", widget: string }
          - { name: more, label: "Scritta 'Scopri di più!' su cartoline e servizi", widget: string }
          - { name: whatsapp, label: "Pulsante WhatsApp (per lettori di schermo)", widget: string }
          - { name: starsLabel, label: "Stelle recensioni (per lettori di schermo)", widget: string, hint: "{n} viene sostituito dal numero di stelle" }
          - name: form
            label: "Modulo di contatto"
            widget: object
            collapsed: true
            fields:
              - { name: name, label: "Campo nome", widget: string }
              - { name: surname, label: "Campo cognome", widget: string }
              - { name: email, label: "Campo email", widget: string }
              - { name: phone, label: "Campo telefono", widget: string }
              - { name: message, label: "Campo messaggio", widget: string }
              - { name: consentBefore, label: "Consenso: testo prima del link", widget: string, required: false }
              - { name: consentLink, label: "Consenso: testo del link alla privacy", widget: string }
              - { name: consentAfter, label: "Consenso: testo dopo il link", widget: string, required: false }
              - { name: sending, label: "Pulsante durante l'invio", widget: string }
              - { name: errorName, label: "Errore nome mancante", widget: string }
              - { name: errorEmail, label: "Errore email non valida", widget: string }
              - { name: errorMessage, label: "Errore messaggio mancante", widget: string }
              - { name: errorConsent, label: "Errore consenso mancante", widget: string }
              - { name: errorSend, label: "Errore invio", widget: string }
              - { name: emailSubject, label: "Oggetto dell'email che ricevi", widget: string }
          - name: footer
            label: "Footer"
            widget: object
            collapsed: true
            fields:
              - { name: socialTitle, label: "Titolo social", widget: string }
              - { name: privacy, label: "Link Privacy", widget: string }
              - { name: cookie, label: "Link Cookie", widget: string }
              - { name: copyright, label: "Copyright", widget: string, hint: "{anno} viene sostituito dall'anno in corso" }
          - name: trip
            label: "Pagina del viaggio"
            widget: object
            collapsed: true
            fields:
              - { name: storyTitle, label: "Titolo racconto", widget: string }
              - { name: itineraryTitle, label: "Titolo tappe", widget: string }
              - { name: galleryTitle, label: "Titolo galleria", widget: string }
              - { name: ctaTitle, label: "Box finale: titolo", widget: string }
              - { name: ctaText, label: "Box finale: testo", widget: text }
              - { name: ctaButton, label: "Box finale: pulsante", widget: string }
              - { name: othersTitle, label: "Titolo 'Altri viaggi'", widget: string }
              - { name: back, label: "Link 'Tutti i viaggi'", widget: string }
          - name: pages
            label: "Pagine di servizio"
            widget: object
            collapsed: true
            fields:
              - { name: updated, label: "Testo 'Ultimo aggiornamento'", widget: string }
              - { name: backHome, label: "Link torna alla home", widget: string }
              - { name: thanksTitle, label: "Pagina grazie: titolo", widget: string }
              - { name: thanksText, label: "Pagina grazie: testo", widget: text }
              - { name: notFoundTitle, label: "Pagina non trovata: titolo", widget: string }
              - { name: notFoundText, label: "Pagina non trovata: testo", widget: text }
              - { name: articleBack, label: "Link 'tutti i consigli'", widget: string }

  # ---------- HOME ----------
  - name: home
    label: "🏠 Home"
    files:
      - name: hero
        label: "Apertura (video)"
        file: src/content/home/hero.json
        fields:
          - { name: video, label: "Video di sfondo (mp4, max 6MB)", widget: file, required: false, hint: "Su telefono e connessioni lente si vede solo l'immagine di sfondo." }
          - { name: videoWebm, label: "Video in formato WebM (facoltativo, più leggero)", widget: file, required: false }
          - { name: poster, label: "Immagine di sfondo (mostrata mentre il video carica e su mobile)", widget: image, required: false }
          - { name: logo, label: "Logo", widget: image }
          - { name: titleLine1, label: "Titolo riga 1", widget: string }
          - { name: titleLine2, label: "Titolo riga 2", widget: string, required: false }
          - { name: subtitle, label: "Sottotitolo", widget: text }
          - { name: ctaPrimary, label: "Pulsante pieno", widget: string }
          - { name: ctaSecondary, label: "Pulsante bordato", widget: string }

      - name: chiSono
        label: "Chi sono"
        file: src/content/home/chi-sono.json
        fields:
          - { name: eyebrow, label: "Titolo corsivo", widget: string, hint: "La parte tra [[ e ]] viene sottolineata dall'onda dorata." }
          - { name: title, label: "Titolo", widget: string, hint: "[[foto]] segna dove inizia la foto. Se lo togli, la foto prende l'altezza di tutto il testo." }
          - { name: photo, label: "Foto", widget: image }
          - { name: photoAlt, label: "Descrizione foto", widget: string }
          - name: paragraphs
            label: "Paragrafi"
            label_singular: "Paragrafo"
            widget: list
            field: { name: text, label: Testo, widget: text, hint: "Nel paragrafo dove deve finire la foto scrivi [[/foto]]" }
          - { name: cta, label: "Testo pulsante", widget: string, required: false }
          - { name: ctaLink, label: "Link pulsante", widget: string, required: false, hint: "Vuoto = pulsante nascosto (es. finché non c'è la pagina 'Chi sono')." }

      - name: servizi
        label: "Servizi"
        file: src/content/home/servizi.json
        fields:
          - { name: eyebrow, label: "Titolo corsivo", widget: string }
          - { name: title, label: "Titolo", widget: string }
          - { name: intro, label: "Introduzione", widget: text, required: false }
          - name: items
            label: "Servizi"
            label_singular: "Servizio"
            widget: list
            summary: "{{fields.title}}"
            fields:
              - { name: title, label: Titolo, widget: string }
              - { name: desc, label: Descrizione, widget: text }
              - { name: icon, label: "Disegno / icona", widget: image, required: false, hint: "Meglio un PNG con sfondo trasparente." }
              - { name: link, label: "Link 'Scopri di più'", widget: string, required: false, hint: "Vuoto = la scheda non è cliccabile." }

      - name: comeFunziona
        label: "Come funziona"
        file: src/content/home/come-funziona.json
        fields:
          - { name: eyebrow, label: "Titolo corsivo", widget: string }
          - { name: title, label: "Titolo", widget: string }
          - name: steps
            label: "Passi"
            label_singular: "Passo"
            widget: list
            summary: "{{fields.title}}"
            fields:
              - { name: title, label: Titolo, widget: string }
              - { name: desc, label: Descrizione, widget: text }
              - { name: image, label: "Immagine", widget: image, required: false }
          - { name: cta, label: "Testo pulsante", widget: string, required: false }
          - { name: ctaLink, label: "Link pulsante", widget: string, required: false }

      - name: viaggiIntro
        label: "Viaggi realizzati (titoli e categorie)"
        file: src/content/home/viaggi.json
        fields:
          - { name: eyebrow, label: "Titolo corsivo", widget: string }
          - { name: title, label: "Titolo", widget: string }
          - { name: subtitle, label: "Sottotitolo", widget: string, required: false }
          - { name: allLabel, label: "Etichetta filtro 'tutti'", widget: string }
          - name: categories
            label: "Categorie (filtri)"
            label_singular: "Categoria"
            widget: list
            hint: "Un filtro compare solo se almeno un viaggio pubblicato usa quella categoria."
            fields:
              - { name: name, label: Nome, widget: string }
          - { name: ctaLabel, label: "Pulsante nella pagina del viaggio", widget: string }

      - name: destinazioni
        label: "Destinazioni"
        file: src/content/home/destinazioni.json
        fields:
          - { name: eyebrow, label: "Titolo corsivo", widget: string }
          - { name: title, label: "Titolo", widget: string }
          - { name: intro, label: "Introduzione", widget: text, required: false }
          - name: items
            label: "Destinazioni"
            label_singular: "Destinazione"
            widget: list
            required: false
            summary: "{{fields.name}}"
            fields:
              - { name: name, label: Nome, widget: string }
              - { name: image, label: Foto, widget: image, required: false }
              - { name: imageAlt, label: "Descrizione foto", widget: string, required: false }
              - { name: icon, label: Icona, widget: select, required: false, options: [asia, africa, oceania, america, europa] }
              - { name: link, label: Link, widget: string, required: false, hint: "Vuoto = non cliccabile." }

      - name: nozze
        label: "Nozze"
        file: src/content/home/nozze.json
        fields: &feature
          - { name: eyebrow, label: "Titolo corsivo", widget: string }
          - { name: title, label: "Titolo", widget: string }
          - { name: text, label: "Testo", widget: text }
          - { name: image, label: "Immagine", widget: image, required: false }
          - { name: imageAlt, label: "Descrizione immagine", widget: string, required: false }
          - { name: cta, label: "Testo pulsante", widget: string }
          - { name: link, label: "Link pulsante", widget: string, hint: "#viaggi porta ai viaggi realizzati." }
          - { name: filter, label: "Categoria da mostrare nei viaggi", widget: string, required: false, hint: "Es. Honey Moon: cliccando il pulsante il carosello mostra solo quella categoria." }

      - name: famiglia
        label: "Famiglia"
        file: src/content/home/famiglia.json
        fields: *feature

      - name: consigli
        label: "Consigli (blog in home)"
        file: src/content/home/consigli.json
        fields:
          - { name: show, label: "Mostra la sezione in home", widget: boolean, default: false, hint: "Compare solo se c'è almeno un articolo pubblicato." }
          - { name: eyebrow, label: "Titoletto", widget: string }
          - { name: title, label: "Titolo", widget: string }

      - name: recensioni
        label: "Recensioni"
        file: src/content/home/recensioni.json
        fields:
          - { name: eyebrow, label: "Titolo corsivo", widget: string }
          - { name: title, label: "Titolo", widget: string }
          - { name: subtitle, label: "Sottotitolo", widget: string, required: false }
          - name: items
            label: "Recensioni"
            label_singular: "Recensione"
            widget: list
            required: false
            hint: "Solo recensioni vere, con il permesso del cliente. Senza recensioni la sezione sparisce."
            summary: "{{fields.name}} — {{fields.trip}}"
            fields:
              - { name: quote, label: Testo, widget: text }
              - { name: name, label: Nome, widget: string }
              - { name: trip, label: Viaggio, widget: string, required: false }
              - { name: stars, label: Stelle, widget: number, value_type: int, min: 1, max: 5, default: 5 }
          - { name: inviteTitle, label: "Invito: titolo", widget: string, required: false }
          - { name: inviteText, label: "Invito: testo", widget: text, required: false }
          - { name: inviteButton, label: "Invito: pulsante", widget: string, required: false }
          - { name: inviteLink, label: "Invito: link (es. pagina recensioni Google)", widget: string, required: false }

      - name: contatti
        label: "Contatti"
        file: src/content/home/contatti.json
        fields:
          - { name: title, label: "Titolo", widget: string }
          - { name: text, label: "Testo", widget: text }
          - { name: submitButton, label: "Pulsante invio", widget: string }
          - { name: successMessage, label: "Messaggio dopo invio", widget: text }

  # ---------- VIAGGI ----------
  - name: viaggi
    label: "✈ Viaggi realizzati"
    label_singular: "Viaggio"
    folder: src/content/viaggi
    create: true
    slug: "{{people}}-{{title}}"
    summary: "{{people}} — {{title}} ({{category}})"
    sortable_fields: [order, title, category]
    fields:
      - { name: people, label: "Chi ha viaggiato (es. Aicha e Nicola)", widget: string, required: false }
      - { name: title, label: "Titolo del viaggio (es. Australia on the road)", widget: string }
      - { name: destination, label: Destinazione, widget: string }
      - { name: duration, label: "Durata (es. 21 giorni)", widget: string, required: false }
      - name: category
        label: Categoria
        widget: relation
        collection: home
        file: viaggiIntro
        search_fields: ["categories.*.name"]
        value_field: "categories.*.name"
        display_fields: ["categories.*.name"]
      - { name: cover, label: "Foto copertina", widget: image, required: false }
      - { name: coverAlt, label: "Descrizione foto", widget: string, required: false }
      - { name: stamp, label: "Francobollo (immagine)", widget: image, required: false, hint: "Meglio un PNG con sfondo trasparente." }
      - name: itinerary
        label: "Le tappe (facoltative)"
        label_singular: "Tappa"
        widget: list
        required: false
        summary: "{{fields.day}} — {{fields.title}}"
        fields:
          - { name: day, label: "Giorni (es. Giorni 1–4)", widget: string, required: false }
          - { name: title, label: Luogo, widget: string }
          - { name: text, label: Descrizione, widget: text, required: false }
      - name: gallery
        label: "Galleria (facoltativa)"
        widget: list
        required: false
        fields:
          - { name: image, label: Foto, widget: image }
          - { name: alt, label: Descrizione, widget: string, required: false }
      - { name: order, label: "Ordine (numero più basso = prima)", widget: number, value_type: int, default: 10 }
      - { name: published, label: Pubblicato, widget: boolean, default: true }
      - { name: body, label: Racconto, widget: markdown, buttons: [bold, italic, link, bulleted-list], editor_components: [] }

  # ---------- BLOG ----------
  - name: articoli
    label: "📝 Consigli di viaggio"
    label_singular: "Articolo"
    folder: src/content/articoli
    create: true
    slug: "{{year}}-{{month}}-{{slug}}"
    summary: "{{title}} ({{date}})"
    fields:
      - { name: title, label: Titolo, widget: string }
      - { name: category, label: Categoria, widget: string }
      - { name: date, label: Data, widget: datetime, format: "YYYY-MM-DD", time_format: false }
      - { name: cover, label: "Immagine", widget: image, required: false }
      - { name: coverAlt, label: "Descrizione immagine", widget: string, required: false }
      - { name: excerpt, label: "Riassunto", widget: text, required: false }
      - { name: published, label: Pubblicato, widget: boolean, default: true }
      - { name: body, label: Testo, widget: markdown }

  # ---------- PAGINE ----------
  - name: pagine
    label: "📄 Pagine"
    files:
      - name: privacy
        label: "Privacy Policy"
        file: src/content/pagine/privacy.md
        fields:
          - { name: title, label: Titolo, widget: string }
          - { name: updated, label: "Ultimo aggiornamento", widget: datetime, format: "YYYY-MM-DD", time_format: false }
          - { name: body, label: Testo, widget: markdown }
      - name: cookie
        label: "Cookie"
        file: src/content/pagine/cookie.md
        fields:
          - { name: title, label: Titolo, widget: string }
          - { name: updated, label: "Ultimo aggiornamento", widget: datetime, format: "YYYY-MM-DD", time_format: false }
          - { name: body, label: Testo, widget: markdown }
